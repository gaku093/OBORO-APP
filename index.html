<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oboro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="screen" class="gut"><div class="col" id="view"></div></div>
  <nav class="tabbar" id="tabbar" aria-label="Navegação principal"><div class="col">
    <button class="tab" data-act="tab" data-tab="home" aria-label="Início"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 5 2 32h9v26h17V40h8v18h17V32h9z" fill="#fff"/></svg></button>
    <button class="tab" data-act="tab" data-tab="search" aria-label="Buscar"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="26" cy="26" r="17" fill="none" stroke="#fff" stroke-width="7"/><path d="M38 38 57 57" stroke="#FFD43B" stroke-width="9" stroke-linecap="round"/></svg></button>
    <button class="tab" data-act="tab" data-tab="profile" aria-label="Perfil"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="#C9C9C9"/><circle cx="32" cy="24" r="10" fill="#fff"/><path d="M11 53c3-12 12-16 21-16s18 4 21 16c-5 5-12 8-21 8s-16-3-21-8z" fill="#fff"/></svg></button>
  </div></nav>
</div>
<div id="reader" class="reader" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

</html>
